name: Merge Queue CI

on:
  merge_group:
    types: [ checks_requested ]

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pass
          MARIADB_DATABASE: dev
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: v0.37.0

      - name: Atlas 유효성 검사 (무결성 체크 포함)
        run: |
          # atlas.sum과 SQL 파일 간의 해시 일치 여부 확인
          atlas migrate validate --dir "file://sql/common"

      - name: Atlas 린트(Lint) 검사
        run: |
          # 병합 대기열(Merge Queue)의 최종 결과물이 MariaDB 환경에서 정상 동작하는지 확인
          atlas migrate lint \
            --dir "file://sql/common" \
            --dev-url "mariadb://root:pass@localhost:3306/dev"
